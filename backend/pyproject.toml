[project]
name = "hermes-console"
version = "0.1.0"
description = "Hermes 飞书 Bot 管控台 backend (FastAPI + SQLite + JWT)"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.45.0",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    "sqlalchemy[asyncio]==2.0.49",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "pyjwt==2.12.1",
    "bcrypt==5.0.0",
    "pwdlib[bcrypt]==0.3.0",
    "python-multipart==0.0.26",
    "cryptography==46.0.7",
    "aiofiles==25.1.0",
    "structlog==25.5.0",
    "email-validator==2.3.0",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "anyio==4.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "freezegun==1.5.5",
    "ruff==0.15.11",
    "mypy==1.20.2",
    "types-aiofiles",
    "types-PyYAML",
    "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.4,<10",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "freezegun==1.5.5",
    "ruff==0.15.11",
    "mypy==1.20.2",
    "types-aiofiles",
    "types-PyYAML",
    "types-psutil",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "smoke: real-host integration smoke tests (require Hermes CLI on PATH)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert allowed in tests
# FastAPI: Depends/Security/Query/etc. as default values is the idiomatic pattern.
"src/app/auth/deps.py" = ["B008"]
"src/app/auth/rbac.py" = ["B008"]
"src/app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["app"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
